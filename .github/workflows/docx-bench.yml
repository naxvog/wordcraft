name: docx bench

# PR score tracking for storytold/wordcraft#5711 with the docxide-pdf suite, on GitHub's free runners. A round:
#   plan      scan.py: open PRs, what to bench (new, new commits, stale against main), the gate. Runs no PR code.
#   baseline  main at the round's commit, when it has no run yet. The only job that saves the cargo cache.
#   bench     one job per PR, 16 at a time: merged into the baseline, built and scored without network (pr.sh)
#   combine   every PR that raised the score merged together, with and without v66-exclude.txt (combine.sh)
#   publish   checks the results (collect.py), commits them to the bench-results branch, renders issue-body.md
# State (runs, PR list, allow.txt, v66-exclude.txt, v66-notes.md) lives in the bench-results branch.
# Start a round: gh workflow run docx-bench.yml -R naxvog/wordcraft [-f max=N] [-f all=true]
# Then post the issue from your machine: .github/docx-bench/post-issue.sh

on:
  workflow_dispatch:
    inputs:
      max:
        description: Most PRs to bench this round
        default: '60'
      all:
        description: Also bench PRs that change no rendering file
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docx-bench
  cancel-in-progress: false

env:
  DOCXIDE_REF: d7afc499c1c302502097fa36cc59df17b5a51f8b   # naxvog/docxide-pdf wordcraft-comparison (harness + fixtures)
  FONTS_REF: abb83316d96aa59c1cf64784289e378fe9fa5695     # storytold/craft-fonts (CRAFT_FONTS_DIR)
  GIST: https://gist.githubusercontent.com/naxvog/54e2039e999cdeacfc0ed59b8da3c6e6/raw/69fd1eff58d0937e943fa2dacce535135da43dce
  BENCH_STATE: ${{ github.workspace }}/state
  BENCH_REPO: ${{ github.workspace }}/wc

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      main: ${{ steps.plan.outputs.main }}
      base: ${{ steps.plan.outputs.base }}
      need_base: ${{ steps.plan.outputs.need_base }}
      todo: ${{ steps.plan.outputs.todo }}
    steps:
      - uses: actions/checkout@v7
        with: {sparse-checkout: .github/docx-bench, persist-credentials: false}
      - uses: actions/checkout@v7
        with: {ref: bench-results, path: state, persist-credentials: false}
      - uses: actions/checkout@v7
        with: {repository: storytold/wordcraft, path: wc, fetch-depth: 0, persist-credentials: false}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ALL: ${{ inputs.all && '--all' || '' }}
          MAX: ${{ inputs.max }}
        run: |
          [[ $MAX =~ ^[0-9]+$ ]] || { echo "max must be a number"; exit 1; }
          (( MAX > 256 )) && MAX=256   # GitHub's limit for one matrix
          python3 -I .github/docx-bench/scan.py $ALL
          base=v66-main-$(git -C wc rev-parse --short=9 origin/main)
          {
            echo "main=$(git -C wc rev-parse origin/main)"
            echo "base=$base"
            [ -f "state/runs/$base/wordcraft_comparison.json" ] && echo need_base=false || echo need_base=true
            echo -n "todo="
            head -n "$MAX" state/v66-todo.txt | python3 -c 'import json, sys
          heads = {str(q["n"]): q["head"] for q in json.load(open("state/v66-prs.json"))}
          print(json.dumps([{"pr": l.strip(), "head": heads[l.strip()]} for l in sys.stdin if l.strip()]))'
          } >> "$GITHUB_OUTPUT"
          tail -4 "$GITHUB_OUTPUT" | cut -c1-300
      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: |
            state/v66-prs.json
            state/v66-removed.json
            state/v66-todo.txt
          retention-days: 7

  baseline:
    needs: plan
    if: needs.plan.outputs.need_base == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {sparse-checkout: .github/docx-bench, persist-credentials: false}
      - uses: ./.github/docx-bench/setup
        with: {ref: '${{ needs.plan.outputs.main }}', save-images: 'true'}
      - env: {BASE: '${{ needs.plan.outputs.base }}'}
        run: |
          . .github/docx-bench/lib.sh
          .github/docx-bench/score.sh wc "run/$BASE"
          meta "run/$BASE" name="$BASE" commit="$(g rev-parse HEAD)" status=ok
      - uses: actions/cache/save@v6
        with:
          path: ~/c
          key: docx-cargo-v2-${{ hashFiles('wc/Cargo.lock', 'dx/Cargo.lock') }}
      - uses: actions/upload-artifact@v7
        with: {name: 'run-${{ needs.plan.outputs.base }}', path: 'run/${{ needs.plan.outputs.base }}', retention-days: 7}

  bench:
    needs: plan
    if: needs.plan.outputs.todo != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.todo) }}
    steps:
      - uses: actions/checkout@v7
        with: {sparse-checkout: .github/docx-bench, persist-credentials: false}
      - uses: ./.github/docx-bench/setup
        with: {ref: '${{ needs.plan.outputs.main }}'}
      - env: {PR: '${{ matrix.pr }}', HEAD: '${{ matrix.head }}', BASE: '${{ needs.plan.outputs.base }}'}
        run: .github/docx-bench/pr.sh "$PR" "$HEAD" "$BASE"
      - if: always()
        uses: actions/upload-artifact@v7
        with: {name: 'run-v66-pr${{ matrix.pr }}', path: 'run/v66-pr${{ matrix.pr }}', retention-days: 7}

  combine:
    needs: [plan, baseline, bench]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.need_base == 'true' || needs.plan.outputs.todo != '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: [combined, combined-excl]
    steps:
      - uses: actions/checkout@v7
        with: {sparse-checkout: .github/docx-bench, persist-credentials: false}
      - uses: actions/checkout@v7
        with: {ref: bench-results, path: state, persist-credentials: false}
      - uses: ./.github/docx-bench/setup
        with: {ref: '${{ needs.plan.outputs.main }}', save-images: 'true'}
      - uses: actions/download-artifact@v8
        with: {pattern: 'run-*', path: art}
      - uses: actions/download-artifact@v8
        with: {name: plan, path: state}
      - env: {BASE: '${{ needs.plan.outputs.base }}', VARIANT: '${{ matrix.variant }}'}
        run: |
          mkdir -p art
          python3 -I .github/docx-bench/collect.py art
          [ -f "state/runs/$BASE/wordcraft_comparison.json" ] || { echo "no baseline run for $BASE"; exit 1; }
          echo "$BASE" > state/current-main
          ex=; [ "$VARIANT" = combined-excl ] && ex=$(cat state/v66-exclude.txt 2>/dev/null)
          [ "$VARIANT" = combined-excl ] && [ -z "$ex" ] && { echo "v66-exclude.txt is empty: same as combined"; exit 0; }
          .github/docx-bench/combine.sh "v66-$VARIANT" $ex
      - if: always()
        uses: actions/upload-artifact@v7
        with: {name: 'run-v66-${{ matrix.variant }}', path: 'run/v66-${{ matrix.variant }}', retention-days: 7}

  publish:
    needs: [plan, baseline, bench, combine]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: {sparse-checkout: .github/docx-bench, persist-credentials: false}
      - uses: actions/checkout@v7
        with: {ref: bench-results, path: state}
      - uses: actions/download-artifact@v8
        with: {pattern: 'run-*', path: art}
      - uses: actions/download-artifact@v8
        with: {name: plan, path: state}
      - env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.plan.outputs.base }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p art
          python3 -I .github/docx-bench/collect.py art
          [ -f "state/runs/$BASE/wordcraft_comparison.json" ] && echo "$BASE" > state/current-main
          # what this round didn't get to stays queued for the next one
          ls art | sed -n 's/^run-v66-pr//p' > done.txt
          grep -vxFf done.txt state/v66-todo.txt > todo.txt || true
          mv todo.txt state/v66-todo.txt
          python3 -I .github/docx-bench/issue.py > state/issue-body.md
          cd state
          git add -A
          git -c user.name=docx-bench -c user.email=docx-bench@users.noreply.github.com commit -qm "Round $RUN_URL"
          git push -q origin HEAD:bench-results
          git show --stat HEAD | tail -3
